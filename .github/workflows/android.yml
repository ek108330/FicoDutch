name: Vérifier FicoDutch Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compiler et analyser l’application
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          sh android/gradlew -p android --no-daemon lintRelease assembleDebug
      - name: Vérifier le jeu sur Android 15
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          echo no | avdmanager create avd --force --name ficodutch --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          mkdir -p android/build/screenshots
          "$ANDROID_HOME/emulator/emulator" -avd ficodutch -no-window -gpu swiftshader -no-audio -no-boot-anim -no-snapshot >android/build/screenshots/emulateur.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          node android/smoke.mjs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-android
          path: android/build/screenshots/
          if-no-files-found: ignore
